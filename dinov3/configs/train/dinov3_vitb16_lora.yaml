MODEL:
  META_ARCHITECTURE: SSLMetaArch

train:
  batch_size_per_gpu: 16
  dataset_path: ImageNet:split=TRAIN
  num_workers: 4
  OFFICIAL_EPOCH_LENGTH: 18644  # ceil(298300 / 16): one full pass over data/tennis/dino_ssl/images
  compile: true

student:
  arch: vit_base
  patch_size: 16
  n_storage_tokens: 4
  mask_k_bias: true
  pretrained_weights: checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

lora:
  enabled: true
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules:
  - attn.qkv
  - attn.proj
  freeze_backbone: true

optim:
  epochs: 8
  lr: 0.0001
  min_lr: 1.0e-06
  warmup_epochs: 2
  weight_decay: 0.0
  weight_decay_end: 0.0
  layerwise_decay: 1.0

checkpointing:
  period: 18644  # save a (resume) checkpoint once per epoch

evaluation:
  eval_period_iterations: 18644  # save EMA teacher_checkpoint.pth once per epoch (used by export_lora_backbone.py)
